spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect # 하이버네트에서 사용할 데이터베이스 플랫폼 지정

  sql:
    init:
      mode: always # 어플리케이션을 시작할 때 초기 sql 스크립트 실행 방법 지정, 항상 초기 sql 실행하겠다는 의미
      platform: h2

  datasource:
    url: jdbc:h2:mem:development;MODE=MYSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console